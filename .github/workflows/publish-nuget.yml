name: Publish NuGet

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches package version
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/Nori.PluginSDK/Nori.PluginSDK.csproj -nologo -getProperty:Version)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$project_version" != "$tag_version" ]]; then
            echo "::error::Tag version '$tag_version' does not match project version '$project_version'."
            exit 1
          fi

      - name: Build
        run: dotnet build Nori.PluginSDK.slnx -c Release

      - name: Pack
        run: dotnet pack src/Nori.PluginSDK/Nori.PluginSDK.csproj -c Release --no-build -o artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
