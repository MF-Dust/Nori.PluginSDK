name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Nori.PluginSDK.slnx -c Release
      - run: dotnet pack src/Nori.PluginSDK/Nori.PluginSDK.csproj -c Release --no-build -o artifacts
